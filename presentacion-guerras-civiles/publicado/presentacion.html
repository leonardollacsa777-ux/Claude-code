o:Mh(`cusco`,2,1,14)},ambiente:`dia`,efectoTexto:`quema`,transicionSiguiente:`rasante`},{id:6,titulo:`Batalla de Las Salinas (1538)`,expositor:`Llacsa`,lugar:`salinas`,cartel:{texto:`LAS SALINAS`,anio:`1538`},puntos:[`Batalla de Las Salinas, cerca del Cusco.`,`Hernando Pizarro derrota a los almagristas.`,`8 de julio de 1538: Diego de Almagro es ejecutado en el Cusco.`],vibra:!0,camara:{posicion:Mh(`salinas`,-16,22,48),objetivo:Mh(`salinas`,-14,4,-1)},ambiente:`polvo`,efectoTexto:`piedras`,transicionSiguiente:`cielo-dia-a-noche`},{id:7,titulo:`El asesinato de Francisco Pizarro (1541)`,expositor:`Llacsa`,lugar:`lima`,cartel:{texto:`LIMA`,anio:`1541`},puntos:[`Los almagristas, llamados "los de Chile", quedaron pobres y resentidos.`,`26 de junio de 1541: entran al palacio de Lima y asesinan a Francisco Pizarro.`,`Almagro el Mozo, hijo de Almagro, se proclama gobernador.`],camara:{posicion:Mh(`lima`,-22,17,42),objetivo:Mh(`lima`,-18,5,-2)},ambiente:`noche`,efectoTexto:`tinta`,transicionSiguiente:`tormenta`},{id:8,titulo:`Batalla de Chupas (1542)`,expositor:`Llacsa`,lugar:`chupas`,cartel:{texto:`CHUPAS`,anio:`1542`},vibra:!0,puntos:[`Segunda guerra: los almagristas contra la Corona.`,`El rey envía a Cristóbal Vaca de Castro.`,`16 de septiembre de 1542: batalla de Chupas, cerca de Huamanga.`,`Almagro el Mozo es derrotado y luego ejecutado en el Cusco.`],camara:{posicion:Mh(`chupas`,-18,19,48),objetivo:Mh(`chupas`,-16,13,0)},ambiente:`lluvia`,efectoTexto:`destello`,transicionSiguiente:`atravesar-corona`},{id:9,titulo:`Las Leyes Nuevas (1542)`,expositor:`Llacsa`,lugar:`chupas`,puntos:[`El rey Carlos I de España (Carlos V) dicta las Leyes Nuevas.`,`Buscaban proteger a los indígenas y prohibían que las encomiendas se heredaran.`,`Se crea el Virreinato del Perú.`,`Los encomenderos se sienten perjudicados y se preparan para rebelarse.`],camara:{posicion:Mh(`chupas`,8,47,58),objetivo:Mh(`chupas`,-8,40,0)},ambiente:`dia`,efectoTexto:`dorado`,transicionSiguiente:`estela-sello`},{id
